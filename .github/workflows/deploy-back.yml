name: Deploy Back-end

on:
  push:
    branches:
      - 'dev'
      - 'master'
    paths:
      - 'fictadvisor-api/**'
      - '.github/**'


jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node and dependencies
        uses: ./.github/actions/install
      - name: Run tests
        run: npx turbo test:unit
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node and dependencies
        uses: ./.github/actions/install
      - name: Start PostgreSQL Database
        run: |
          docker compose -f fictadvisor-api/docker-compose.yml up -d && sleep 5s
      - name: Start migration
        run: npx turbo migrate:test
      - name: Start seeding
        run: npx turbo test:seed
      - name: Run integration tests
        run: npx turbo test:integration

  build-arm64:
    needs: [ test, integration-test ]
    runs-on: self-hosted-ubuntu-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cleanup Pre-Build
        run: docker system prune -f || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push ARM64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./fictadvisor-api/Dockerfile
          platforms: linux/arm64
          push: true
          pull: true
          tags: fictadvisor/fictadvisor-api:${{ github.ref_name }}-arm64
          build-args: |
            DEPLOY_ENV=${{ github.ref_name == 'master' && 'production' || 'development' }}

  build-amd64:
    needs: [ test, integration-test ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push AMD64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./fictadvisor-api/Dockerfile
          platforms: linux/amd64
          push: true
          pull: true
          tags: fictadvisor/fictadvisor-api:${{ github.ref_name }}-amd64
          build-args: |
            DEPLOY_ENV=${{ github.ref_name == 'master' && 'production' || 'development' }}

  merge:
    needs: [ build-arm64, build-amd64 ]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Create and push manifest list
        run: |
          docker buildx imagetools create \
            -t fictadvisor/fictadvisor-api:${{ github.ref_name }} \
            fictadvisor/fictadvisor-api:${{ github.ref_name }}-amd64 \
            fictadvisor/fictadvisor-api:${{ github.ref_name }}-arm64

  # The runner sits on the swarm manager itself, so rolling out needs no SSH and no
  # secret beyond the registry login -- the same reason deploy-monitoring.yml can write
  # ~/deployment directly.
  deploy:
    needs: [ merge ]
    runs-on: self-hosted-ubuntu-arm64
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # The new image goes in pinned by digest. `--image <same moving tag>` was meant to
      # re-resolve the tag, but from this runner it stores the bare tag instead; the spec
      # then equals the last deploy's and Swarm treats the update as a no-op. That is how
      # prod ran the 2026-09-08 image until 2026-11-06 through every deploy in between.
      # A digest changes on every push, so every push is a real update. Swarm then rolls
      # the task under the stack's update_config: start the new one, wait for the
      # healthcheck in the image, and only then stop the old one.
      - name: Roll out the new image
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            service=fa_api-dev
          else
            service=fa_api
          fi
          # Until the swarm migration has run this service does not exist and watchtower
          # is still what deploys the image. Skip rather than fail the pipeline.
          if ! docker service inspect "$service" >/dev/null 2>&1; then
            echo "::notice::$service is not a swarm service yet, skipping the roll-out"
            exit 0
          fi
          image=fictadvisor/fictadvisor-api:${{ github.ref_name }}
          digest=$(docker buildx imagetools inspect "$image" --format '{{json .Manifest}}' | jq -r .digest)
          case "$digest" in
            sha256:*) ;;
            *) echo "::error::could not resolve $image to a digest (got '$digest')"; exit 1 ;;
          esac
          echo "Deploying $image@$digest"
          docker service update \
            --with-registry-auth \
            --image "$image@$digest" \
            "$service"
          running=$(docker service inspect "$service" --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')
          case "$running" in
            *"$digest") ;;
            *) echo "::error::$service spec is '$running', expected $digest"; exit 1 ;;
          esac

      - name: Report what ended up running
        if: always()
        run: |
          service=$([ "${{ github.ref_name }}" = "dev" ] && echo fa_api-dev || echo fa_api)
          docker service ps --no-trunc "$service" || true
