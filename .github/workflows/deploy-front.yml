name: Deploy Front

on:
  push:
    branches:
      - 'master'
    paths:
      - 'fictadvisor-web/**'
      - '.github/**'

env:
  IMAGE: fictadvisor/fictadvisor-web

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./fictadvisor-web/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            NODE_ENV=${{ github.ref_name == 'master' && 'production' || 'development' }}
          cache-from: type=gha,scope=web-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=web-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          retention-days: 1
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t ${{ env.IMAGE }}:${{ github.ref_name }} \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ github.ref_name }}

  deploy:
    needs: [ merge ]
    runs-on: self-hosted-ubuntu-arm64
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # See deploy-back.yml for why this is `--image` rather than `--force`.
      - name: Roll out the new image
        run: |
          service=fa_web
          # Until the swarm migration has run this service does not exist and watchtower
          # is still what deploys the image. Skip rather than fail the pipeline.
          if ! docker service inspect "$service" >/dev/null 2>&1; then
            echo "::notice::$service is not a swarm service yet, skipping the roll-out"
            exit 0
          fi
          docker service update \
            --with-registry-auth \
            --image ${{ env.IMAGE }}:${{ github.ref_name }} \
            fa_web

      - name: Report what ended up running
        if: always()
        run: docker service ps --no-trunc fa_web || true
